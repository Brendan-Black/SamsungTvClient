name: Release

on:
  push:
    tags: ['[0-9]*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: corretto
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew check jar
      - name: Attach the jar to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$VERSION" >/dev/null 2>&1 \
            || gh release create "$VERSION" --title "$VERSION" --generate-notes
          gh release upload "$VERSION" build/libs/SamsungTvClient-*.jar --clobber
      - name: Ask JitPack to build the tag
        run: curl -fsS -m 600 "https://jitpack.io/com/github/Brendan-Black/SamsungTvClient/$VERSION/build.log" | tail -20
